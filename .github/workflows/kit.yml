name: kit
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 tests/test_spry.py
      - run: python3 plugins/spry/tool/spry.py --root docs/example check
      - run: python3 plugins/spry/tool/spry.py --root docs/example index --check
