# Written by /spry:init. Cheapest first, and tests only when code changed:
# spry check → fast checks (format, lint, types) → tests. A change to documents alone
# (checks.docs in spry.config.json) runs spry check and nothing else.
# Pull requests: affected tests; check --base refuses generated blocks the branch changed.
# Main branch: every test, then spry index commits the progress tables. Nightly: every test.
name: spry
on:
  pull_request:
  push:
    branches: [<main branch>]
  schedule:
    - cron: "0 2 * * *"
concurrency:
  group: spry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: python3 spry/tool/spry.py check --base origin/${{ github.base_ref }}
      - if: github.event_name == 'push'
        run: python3 spry/tool/spry.py check
      - id: changed
        run: python3 spry/tool/spry.py changed --base ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }} >> "$GITHUB_OUTPUT"
  fast:
    needs: check
    if: needs.check.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # <setup steps for the stack — stacks/<stack>.md>
      - run: <each command in checks.fast, one step each, cheapest first>
  affected-tests:
    needs: [check, fast]
    if: github.event_name == 'pull_request' && needs.check.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # <setup steps for the stack — stacks/<stack>.md>
      - run: <affected tests command, against origin/${{ github.base_ref }}>
  all-tests:
    needs: [check, fast]
    if: >-
      !cancelled() && (github.event_name == 'schedule' ||
      (github.event_name == 'push' && needs.check.outputs.code == 'true' && needs.fast.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # <setup steps for the stack — stacks/<stack>.md>
      - run: <all tests command>
  index:
    needs: [check, all-tests]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.check.result == 'success' &&
      needs.all-tests.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Slice branches, so the backlog lists a slice someone is building as in progress.
      - run: git fetch --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
      - run: python3 spry/tool/spry.py index
      - run: |
          git diff --quiet && exit 0
          git config user.name "spry"
          git config user.email "spry@users.noreply.github.com"
          git commit -am "chore(spry): refresh progress [skip ci]"
          git push
